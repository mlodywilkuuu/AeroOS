<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroOS - Uruchamianie systemu</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ANIMOWANY, ŻYWY GRADIENT W TLE */
        body {
            background: linear-gradient(-45deg, #020617, #0f172a, #1e1b4b, #311042);
            background-size: 400% 400%;
            animation: gradientMove 12s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* EFEKT CZYSTEGO SZKŁA (GLASSMORPHISM) */
        .glass-loader {
            width: 550px;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* LOGO / NAZWA SYSTEMU */
        .logo {
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 3px;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .subtitle {
            font-size: 12px;
            color: #569cd6;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
        }

        /* WIRTUALNY TERMINAL ROZRUCHOWY */
        .boot-terminal {
            width: 100%;
            height: 150px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            padding: 15px;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            text-align: left;
            overflow-y: auto;
            color: #d4d4d4;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 30px;
        }

        .line { margin-bottom: 5px; }
        .white { color: #ffffff; }
        .green { color: #4ade80; }
        .blue { color: #38bdf8; }
        .red { color: #f87171; }

        /* KRĘCĄCE SIĘ KROPKI W STYLU WINDOWS */
        .windows-spinner {
            position: relative;
            width: 36px;
            height: 36px;
        }

        .windows-spinner .dot {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transform: rotate(225deg);
            animation: spinnerAnim 4.5s infinite;
        }

        .windows-spinner .dot:after {
            content: "";
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 8px #38bdf8;
        }

        .windows-spinner .dot:nth-child(2) { animation-delay: 0.15s; }
        .windows-spinner .dot:nth-child(3) { animation-delay: 0.3s; }
        .windows-spinner .dot:nth-child(4) { animation-delay: 0.45s; }
        .windows-spinner .dot:nth-child(5) { animation-delay: 0.6s; }

        @keyframes spinnerAnim {
            0% { transform: rotate(225deg); opacity: 1; animation-timing-function: ease-out; }
            7% { transform: rotate(345deg); animation-timing-function: linear; }
            30% { transform: rotate(455deg); animation-timing-function: ease-in-out; }
            39% { transform: rotate(570deg); animation-timing-function: linear; }
            70% { transform: rotate(815deg); opacity: 1; animation-timing-function: ease-out; }
            75% { transform: rotate(945deg); animation-timing-function: ease-out; }
            76% { transform: rotate(945deg); opacity: 0; }
            100% { transform: rotate(945deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="glass-loader">
        <div class="logo">AeroOS</div>
        <div class="subtitle">System Bootloader</div>

        <div class="boot-terminal" id="terminal"></div>

        <div class="windows-spinner">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        let currentColor = 'white';

        function writeToScreen(text, color) {
            const line = document.createElement('div');
            line.className = `line ${color}`;
            line.innerText = text;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }

        async function startBoot() {
            try {
                // Wczytywanie komend z zewnętrznego pliku tekstowego
                const response = await fetch('bootloader.txt');
                if (!response.ok) throw new Error();
                const text = await response.text();
                const lines = text.split('\n');

                for (let line of lines) {
                    let trimmed = line.trim();
                    if (!trimmed) continue;

                    if (trimmed.startsWith('PRINT ')) {
                        writeToScreen(trimmed.substring(6), currentColor);
                        await new Promise(r => setTimeout(r, 80));
                    } else if (trimmed.startsWith('COLOR ')) {
                        currentColor = trimmed.substring(6).toLowerCase();
                    } else if (trimmed.startsWith('WAIT ')) {
                        let sec = parseFloat(trimmed.substring(5));
                        await new Promise(r => setTimeout(r, sec * 1000));
                    } else if (trimmed === 'CLEAR') {
                        terminal.innerHTML = '';
                    }
                }

                // Po zakończeniu skryptu z bootloader.txt poczekaj chwilę i przejdź do systemu
                await new Promise(r => setTimeout(r, 1000));
                window.location.href = 'index.html';

            } catch (err) {
                writeToScreen("BŁĄD BOOTLOADERA: Nie można załadować pliku bootloader.txt", "red");
            }
        }

        window.onload = startBoot;
    </script>
</body>
</html>
