<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroOS - Podgląd Systemu</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ANIMOWANY GRADIENT W TLE */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #2e1065, #3b0764);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* EFEKT SZKŁA (GLASSMORPHISM) */
        .glass-container {
            width: 700px;
            height: 500px;
            background: rgba(15, 15, 20, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            color: #569cd6;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
            text-shadow: 0 0 8px rgba(86, 156, 214, 0.3);
        }

        /* TERMINAL KONSOLI */
        .terminal {
            flex-increment: 1;
            flex: 1;
            background: #050505;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            overflow-y: auto;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* STYLIZACJA LINII TEKSTU */
        .line { margin-bottom: 4px; }
        .white { color: #ffffff; }
        .green { color: #39ff14; text-shadow: 0 0 5px rgba(57, 255, 20, 0.4); }
        .blue { color: #00bfff; text-shadow: 0 0 5px rgba(0, 191, 255, 0.4); }
        .red { color: #ff4500; text-shadow: 0 0 5px rgba(255, 69, 0, 0.4); }

        /* PASEK ŁADOWANIA WINDOWS STYLE */
        .progress-bar-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            margin-top: 15px;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            width: 30%;
            height: 100%;
            background: #569cd6;
            position: absolute;
            left: -30%;
            border-radius: 2px;
            display: none;
        }

        .loading .progress-bar {
            display: block;
            animation: loadingAnim 1.5s infinite linear;
        }

        @keyframes loadingAnim {
            0% { left: -30%; }
            100% { left: 100%; }
        }

        .status {
            text-align: center;
            color: #888;
            font-size: 11px;
            margin-top: 8px;
        }
    </style>
</head>
<body class="loading">

    <div class="glass-container">
        <div class="header">AeroOS Virtual Monitor</div>
        <div class="terminal" id="terminal"></div>
        
        <div class="progress-bar-container">
            <div class="progress-bar"></div>
        </div>
        <div class="status" id="status">Status: Bootowanie...</div>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const statusLbl = document.getElementById('status');
        let currentColor = 'white';

        function writeToScreen(text, color) {
            const line = document.createElement('div');
            line.className = `line ${color}`;
            line.innerText = text;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function clearScreen() {
            terminal.innerHTML = '';
        }

        async function executeScript(filename) {
            try {
                const response = await fetch(filename);
                if (!response.ok) throw new Error();
                const text = await response.text();
                const lines = text.split('\n');

                for (let line of lines) {
                    let trimmed = line.trim();
                    if (!trimmed) continue;

                    if (trimmed.startsWith('PRINT ')) {
                        writeToScreen(trimmed.substring(6), currentColor);
                        await new Promise(r => setTimeout(r, 60));
                    } else if (trimmed.startsWith('COLOR ')) {
                        currentColor = trimmed.substring(6).toLowerCase();
                    } else if (trimmed.startsWith('WAIT ')) {
                        let sec = parseFloat(trimmed.substring(5));
                        await new Promise(r => setTimeout(r, sec * 1000));
                    } else if (trimmed === 'CLEAR') {
                        clearScreen();
                    }
                }
            } catch (err) {
                writeToScreen(`BŁĄD KRYTYCZNY: Nie mozna zaladowac pliku ${filename}`, 'red');
            }
        }

        async function bootSystem() {
            document.body.classList.add('loading');
            statusLbl.innerText = "Status: Uruchamianie systemu...";
            clearScreen();
            currentColor = 'white';

            // 1. Ekran Ładowania
            await executeScript('bootloader.txt');
            await new Promise(r => setTimeout(r, 300));
            clearScreen();

            // 2. Rdzeń Systemu
            await executeScript('aeroos.txt');

            document.body.classList.remove('loading');
            statusLbl.innerText = "Status: AeroOS Live Active (CPU Idle)";
        }

        // Start systemu od razu po wejściu na stronę
        window.onload = bootSystem;
    </script>
</body>
</html>
