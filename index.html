<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroOS - Brama sieciowa</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* NOWOCZESNY ANIMOWANY GRADIENT W TLE */
        body {
            background: linear-gradient(-45deg, #020617, #0f172a, #1e1b4b, #2e1065);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* EFEKT SZKŁA (GLASSMORPHISM) */
        .glass-panel {
            width: 450px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: all 0.5s ease;
        }

        /* SZEFY INTERFEJSU */
        .logo-space {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            color: white;
            font-weight: bold;
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.3);
            margin-bottom: 20px;
        }

        h2 {
            color: #ffffff;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* FORMULARZE I INPUTY */
        .input-group {
            width: 100%;
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            color: #cbd5e1;
            font-size: 12px;
            display: block;
            margin-bottom: 6px;
            margin-left: 4px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
        }

        /* PRZYCISKI */
        button {
            width: 100%;
            padding: 12px;
            background: #38bdf8;
            border: none;
            border-radius: 10px;
            color: #020617;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 15px;
        }

        button:hover {
            background: #0ea5e9;
            transform: translateY(-1px);
        }

        /* SEKCJE EKRANÓW (UKRYTE DOMYŚLNIE) */
        .screen {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }

        .active {
            display: flex;
        }

        /* BŁĘDY */
        .error-msg {
            color: #f87171;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        /* KRĘCĄCE SIĘ KÓŁKO W STYLU WINDOWS */
        .windows-spinner {
            position: relative;
            width: 40px;
            height: 40px;
            margin-top: 20px;
        }

        .windows-spinner .dot {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transform: rotate(225deg);
            animation: spinnerAnim 4.5s infinite;
        }

        .windows-spinner .dot:after {
            content: "";
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 10px #38bdf8;
        }

        .windows-spinner .dot:nth-child(2) { animation-delay: 0.15s; }
        .windows-spinner .dot:nth-child(3) { animation-delay: 0.3s; }
        .windows-spinner .dot:nth-child(4) { animation-delay: 0.45s; }
        .windows-spinner .dot:nth-child(5) { animation-delay: 0.6s; }

        @keyframes spinnerAnim {
            0% { transform: rotate(225deg); opacity: 1; animation-timing-function: ease-out; }
            7% { transform: rotate(345deg); animation-timing-function: linear; }
            30% { transform: rotate(455deg); animation-timing-function: ease-in-out; }
            39% { transform: rotate(570deg); animation-timing-function: linear; }
            70% { transform: rotate(815deg); opacity: 1; animation-timing-function: ease-out; }
            75% { transform: rotate(945deg); animation-timing-function: ease-out; }
            76% { transform: rotate(945deg); opacity: 0; }
            100% { transform: rotate(945deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="glass-panel">
        
        <div class="screen" id="screen-config">
            <div class="logo-space">A</div>
            <h2>Konfiguracja AeroOS</h2>
            <p>Stwórz swoje konto użytkownika pierwszego uruchomienia.</p>
            
            <div class="input-group">
                <label>Nazwa użytkownika</label>
                <input type="text" id="cfg-username" placeholder="np. Mateusz">
            </div>
            <div class="input-group">
                <label>Hasło dostępowe</label>
                <input type="password" id="cfg-password" placeholder="Wpisz silne hasło">
            </div>
            <button onclick="saveConfiguration()">Zatwierdź i uruchom</button>
            <div class="error-msg" id="cfg-error">Uzupełnij wszystkie pola!</div>
        </div>

        <div class="screen" id="screen-login">
            <div class="logo-space" id="user-avatar">U</div>
            <h2 id="login-welcome">Witaj ponownie</h2>
            <p>Wpisz hasło, aby odblokować system.</p>
            
            <div class="input-group">
                <input type="password" id="login-password" placeholder="Hasło" onkeypress="handleKeyPress(event)">
            </div>
            <button onclick="attemptLogin()">Zaloguj się</button>
            <div class="error-msg" id="login-error">Niepoprawne hasło! Spróbuj ponownie.</div>
        </div>

        <div class="screen" id="screen-loading">
            <div class="logo-space">A</div>
            <h2 id="loading-text">Przygotowywanie pulpitu...</h2>
            <p>To zajmie tylko chwilę.</p>
            
            <div class="windows-spinner">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>

    </div>

    <script>
        // Sprawdzamy czy użytkownik już istnieje w bazie danych przeglądarki
        window.onload = function() {
            const hasAccount = localStorage.getItem('aeroos_configured');
            
            if (hasAccount === 'true') {
                // Jeśli konto istnieje -> Idź od razu do logowania
                const username = localStorage.getItem('aeroos_username');
                document.getElementById('login-welcome').innerText = username;
                document.getElementById('user-avatar').innerText = username.charAt(0).toUpperCase();
                showScreen('screen-login');
            } else {
